archs:
  - x86_64
env_file: test.env
ports:
  - 80/tcp
  - "8080"
volumes:
  - /var/log
  - /var/lib/data
paths:
  - path: /var/log/app
    type: directory
    uid: 1000
    gid: 1000
    mode: "0755"
  - path: /var/run/app.pid
    type: empty-file
    uid: 0
    gid: 0
    mode: "0644"
  - path: /etc/ssl/cert.pem
    type: symlink
    target: /etc/pki/tls-ca-bundle.pem
